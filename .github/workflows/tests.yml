name: repository checks

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Bash clean install
        if: runner.os != 'Windows'
        shell: bash
        run: bash test/clean-install.sh
      - name: Bash no-private
        shell: bash
        run: bash test/no-private.sh
      - name: Bash no-private negative cases
        shell: bash
        run: bash test/no-private-regression.sh
      - name: PowerShell clean install
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File test/clean-install.ps1
      - name: PowerShell no-private
        shell: pwsh
        run: pwsh -NoProfile -File test/no-private.ps1
      - name: PowerShell no-private negative case
        shell: pwsh
        run: pwsh -NoProfile -File test/no-private-regression.ps1
