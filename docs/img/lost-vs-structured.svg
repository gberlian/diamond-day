<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 695" width="960" height="695" role="img" aria-labelledby="title desc">
<title id="title">Lost versus structured execution</title><desc id="desc">Left: chat-only work accumulates history, waits on unseen questions and loses evidence. Right: goals, cards, decision inbox, proof, checks and resume note preserve state.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#526479"/></marker></defs>
<rect width="960" height="695" rx="18" fill="#f5f7fa"/>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#182b40} .title{font-size:29px;font-weight:700} .sub{font-size:16px;fill:#53677c} .head{font-size:21px;font-weight:700} .body{font-size:17px} .small{font-size:15px;fill:#53677c} .line{stroke:#526479;stroke-width:2.5;fill:none;marker-end:url(#arrow)} .dash{stroke-dasharray:7 5}</style>
<text x="32" y="44" class="title" text-anchor="start">Lost versus structured execution</text>
<text x="32" y="71" class="sub" text-anchor="start">Same agent task, different ways to carry state</text>
<text x="48" y="112" class="head" text-anchor="start">Chat-only workflow</text>
<text x="512" y="112" class="head" text-anchor="start">ARPE workflow</text>
<rect x="32" y="130" width="432" height="82" rx="12" fill="#fff5f2" stroke="#d5aaa1" stroke-width="1.8"/>
<text x="50" y="161" class="head" text-anchor="start">Request in chat</text>
<text x="50" y="188" class="body" text-anchor="start">Goal is buried as history grows</text>
<rect x="496" y="130" width="432" height="82" rx="12" fill="#edf7f2" stroke="#98bdad" stroke-width="1.8"/>
<text x="514" y="161" class="head" text-anchor="start">Result + Purpose</text>
<text x="514" y="188" class="body" text-anchor="start">Measurable outcome in project files</text>
<path d="M248 212 V236" class="line"/>
<path d="M712 212 V236" class="line"/>
<rect x="32" y="236" width="432" height="82" rx="12" fill="#fff5f2" stroke="#d5aaa1" stroke-width="1.8"/>
<text x="50" y="267" class="head" text-anchor="start">Question in chat</text>
<text x="50" y="294" class="body" text-anchor="start">Owner may never see it</text>
<rect x="496" y="236" width="432" height="82" rx="12" fill="#edf7f2" stroke="#98bdad" stroke-width="1.8"/>
<text x="514" y="267" class="head" text-anchor="start">Plan + decision inbox</text>
<text x="514" y="294" class="body" text-anchor="start">Work independent cards; save answers</text>
<path d="M248 318 V342" class="line"/>
<path d="M712 318 V342" class="line"/>
<rect x="32" y="342" width="432" height="82" rx="12" fill="#fff5f2" stroke="#d5aaa1" stroke-width="1.8"/>
<text x="50" y="373" class="head" text-anchor="start">More messages</text>
<text x="50" y="400" class="body" text-anchor="start">Repeated waiting or retries</text>
<rect x="496" y="342" width="432" height="82" rx="12" fill="#edf7f2" stroke="#98bdad" stroke-width="1.8"/>
<text x="514" y="373" class="head" text-anchor="start">Next actionable card</text>
<text x="514" y="400" class="body" text-anchor="start">Back off when work is blocked</text>
<path d="M248 424 V448" class="line"/>
<path d="M712 424 V448" class="line"/>
<rect x="32" y="448" width="432" height="82" rx="12" fill="#fff5f2" stroke="#d5aaa1" stroke-width="1.8"/>
<text x="50" y="479" class="head" text-anchor="start">Done report</text>
<text x="50" y="506" class="body" text-anchor="start">Evidence must be searched for</text>
<rect x="496" y="448" width="432" height="82" rx="12" fill="#edf7f2" stroke="#98bdad" stroke-width="1.8"/>
<text x="514" y="479" class="head" text-anchor="start">Proof + runnable Check</text>
<text x="514" y="506" class="body" text-anchor="start">Evidence on board, with last-run time</text>
<path d="M248 530 V554" class="line"/>
<path d="M712 530 V554" class="line"/>
<rect x="32" y="554" width="432" height="82" rx="12" fill="#fff5f2" stroke="#d5aaa1" stroke-width="1.8"/>
<text x="50" y="585" class="head" text-anchor="start">Restart</text>
<text x="50" y="612" class="body" text-anchor="start">Prior conversation is gone</text>
<rect x="496" y="554" width="432" height="82" rx="12" fill="#edf7f2" stroke="#98bdad" stroke-width="1.8"/>
<text x="514" y="585" class="head" text-anchor="start">Resume note</text>
<text x="514" y="612" class="body" text-anchor="start">Fresh session reads saved state</text>
<text x="32" y="674" class="small" text-anchor="start">The board makes the state of work visible; the project files carry it across sessions.</text>
</svg>
